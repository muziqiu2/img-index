<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>魔法师图床 · 数据统计</title>
    <meta name="description" content="魔法师图床 Cloudflare 线路的流量与请求统计。">
    <meta name="theme-color" content="#2563eb">

    <!-- favicon（与首页保持一致） -->
    <link rel="icon" type="image/svg+xml" href="static/images/logo.svg">
    <link rel="shortcut icon" href="static/images/logo.svg">
    <link rel="apple-touch-icon" href="static/images/apple-touch-icon.png">

    <style>
        /* ==========================================================================
           魔法师图床 · 数据统计页样式
           设计语言：与静态首页 public/index.html 共用同一套 "Corporate Clean" 令牌
             · 浅灰底 #f7f8fa + 白卡片，1px 细描边 #e4e7ec
             · 品牌蓝 #2563eb，圆角 8 / 10 / 12px
             · 无渐变、无发光，靠细边框与微阴影体现质感
           令牌取值逐字抄自 index.html，改首页配色时这里要一起改。
           ========================================================================== */

        :root {
            /* 色彩 */
            --cc-bg: #f7f8fa;
            --cc-surface: #ffffff;
            --cc-line: #e4e7ec;
            --cc-line-strong: #cbd2dc;
            --cc-ink: #1f2430;
            --cc-sub: #5f6b7a;
            --cc-muted: #98a1b0;
            --cc-accent: #2563eb;
            --cc-accent-hover: #1d4ed8;
            --cc-accent-soft: #eff4ff;
            --cc-accent-line: #dbe6ff;

            /* 图表用色：品牌蓝 + 中性石板灰（首页只有蓝这一支强调色，第二支走中性） */
            --cc-chart-req: #2563eb;
            --cc-chart-bytes: #64748b;
            --cc-grid: rgba(31, 36, 48, .06);
            --cc-danger: #b91c1c;

            /* 尺度 */
            --cc-r-sm: 8px;
            --cc-r: 10px;
            --cc-r-lg: 12px;
            --cc-wrap: 1120px;
            --cc-gutter: clamp(20px, 5vw, 40px);

            /* 阴影（与首页同源） */
            --cc-shadow-card: 0 1px 2px rgba(31, 36, 48, .03), 0 4px 16px -8px rgba(31, 36, 48, .06);
            --cc-shadow-lift: 0 8px 18px -8px rgba(37, 99, 235, .42), 0 2px 6px rgba(31, 36, 48, .06);

            /* 排版：与首页逐字一致（Nunito 优先，未加载时回落系统 UI） */
            --cc-font: Nunito, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            --cc-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

            /* 动效 */
            --cc-ease: cubic-bezier(.22, .8, .3, 1);
            --cc-dur: .18s;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--cc-bg);
            color: var(--cc-ink);
            font-family: var(--cc-font);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        img, svg { display: block; max-width: 100%; }
        a { color: inherit; text-decoration: none; }
        h1, h2, p { margin: 0; }
        button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

        :where(a, button):focus-visible {
            outline: 2px solid var(--cc-accent);
            outline-offset: 2px;
            border-radius: var(--cc-r-sm);
        }

        /* 跳到主要内容 */
        .skip {
            position: absolute;
            left: -9999px;
            top: 0;
            z-index: 200;
            background: var(--cc-accent);
            color: #fff;
            padding: 10px 18px;
            border-radius: 0 0 var(--cc-r-sm) 0;
            font-size: 14px;
            font-weight: 600;
        }
        .skip:focus { left: 0; }

        .wrap {
            width: 100%;
            max-width: var(--cc-wrap);
            margin-inline: auto;
            padding-inline: var(--cc-gutter);
        }

        /* ---------- 顶部导航（与首页同款：统计 / 状态 / 赞助） ---------- */
        .hdr {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--cc-surface);
            border-bottom: 1px solid var(--cc-line);
            box-shadow: 0 1px 2px rgba(31, 36, 48, .04);
        }
        .hdr__in {
            display: flex;
            align-items: center;
            gap: 16px;
            min-height: 64px;
        }
        .brand { display: inline-flex; align-items: center; flex: none; }
        .brand__img { height: 38px; width: auto; }

        .nav {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: auto;
        }
        .nav__link {
            padding: 8px 13px;
            border-radius: var(--cc-r-sm);
            font-size: 14.5px;
            font-weight: 500;
            color: var(--cc-sub);
            transition: background-color var(--cc-dur) var(--cc-ease), color var(--cc-dur) var(--cc-ease);
        }
        .nav__link:hover { background: var(--cc-accent-soft); color: var(--cc-accent); }
        .nav__link.is-active { background: var(--cc-accent-soft); color: var(--cc-accent); font-weight: 700; }

        .hdr__cta { margin-left: 8px; }

        .clock {
            margin-left: 12px;
            font-size: 13px;
            color: var(--cc-sub);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* ---------- 按钮 ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 20px;
            border: 1px solid transparent;
            border-radius: var(--cc-r-sm);
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
            transition: transform var(--cc-dur) var(--cc-ease),
                        box-shadow var(--cc-dur) var(--cc-ease),
                        background-color var(--cc-dur) var(--cc-ease),
                        border-color var(--cc-dur) var(--cc-ease),
                        color var(--cc-dur) var(--cc-ease);
        }
        .btn svg { width: 17px; height: 17px; flex: none; }

        .btn--primary {
            background: var(--cc-accent);
            color: #fff;
            box-shadow: 0 1px 2px rgba(31, 36, 48, .08);
        }
        .btn--primary:hover {
            background: var(--cc-accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--cc-shadow-lift);
        }
        .btn--primary:active { transform: translateY(0) scale(.98); }

        .btn--ghost {
            background: var(--cc-surface);
            color: var(--cc-ink);
            border-color: var(--cc-line-strong);
        }
        .btn--ghost:hover {
            border-color: var(--cc-accent);
            color: var(--cc-accent);
            background: var(--cc-accent-soft);
        }
        .btn--ghost:active { transform: scale(.98); }
        .btn--sm { padding: 8px 14px; font-size: 14px; }

        /* ---------- 主体 ---------- */
        .page { padding-block: clamp(28px, 4vw, 40px) clamp(44px, 6vw, 64px); }

        .page__title {
            font-size: clamp(1.4rem, 3.2vw, 1.75rem);
            font-weight: 800;
            letter-spacing: -.022em;
        }
        .meta {
            margin-top: 6px;
            font-size: 12.5px;
            color: var(--cc-sub);
            font-variant-numeric: tabular-nums;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 22px;
        }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }

        .metric {
            background: var(--cc-surface);
            border: 1px solid var(--cc-line);
            border-radius: var(--cc-r-lg);
            box-shadow: var(--cc-shadow-card);
            padding: 18px 18px 16px;
            min-width: 0;
            transition: transform var(--cc-dur) var(--cc-ease),
                        box-shadow var(--cc-dur) var(--cc-ease),
                        border-color var(--cc-dur) var(--cc-ease);
        }
        .metric:hover {
            transform: translateY(-2px);
            border-color: var(--cc-accent-line);
            box-shadow: var(--cc-shadow-lift);
        }
        .metric .label {
            font-size: 12px;
            font-weight: 600;
            color: var(--cc-sub);
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .metric .value {
            font-size: clamp(18px, 4.6vw, 26px);
            font-weight: 700;
            letter-spacing: -.5px;
            line-height: 1.15;
            font-variant-numeric: tabular-nums;
        }
        .metric .sub {
            min-height: 19px;
            margin-top: 8px;
            font-size: 12px;
            color: var(--cc-sub);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 缓存命中率进度条 */
        .meter {
            margin-top: 12px;
            height: 5px;
            border-radius: 999px;
            background: var(--cc-line);
            overflow: hidden;
            visibility: hidden;
        }
        .meter.is-on { visibility: visible; }
        .meter i {
            display: block;
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: var(--cc-accent);
            transition: width .6s var(--cc-ease);
        }

        /* ---------- 骨架屏与数值入场 ---------- */
        .skel {
            color: transparent !important;
            background: var(--cc-line);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            user-select: none;
        }
        .skel::after {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.6), rgba(255,255,255,0));
            animation: skel 1.3s infinite;
        }
        @keyframes skel { to { transform: translateX(100%); } }

        @keyframes rise {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: none; }
        }
        .value.is-in { animation: rise .4s var(--cc-ease) both; }

        .panel {
            background: var(--cc-surface);
            border: 1px solid var(--cc-line);
            border-radius: var(--cc-r-lg);
            box-shadow: var(--cc-shadow-card);
            margin-top: 14px;
            padding: 20px 20px 16px;
        }
        .panel h2 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--cc-sub);
            letter-spacing: .04em;
            margin-bottom: 16px;
        }
        .panel h2 .dot {
            width: 7px;
            height: 7px;
            border-radius: 2px;
            background: var(--dot, var(--cc-chart-req));
            flex: none;
        }
        .panel h2 .hint {
            margin-left: auto;
            font-weight: 500;
            font-size: 11.5px;
            letter-spacing: 0;
            color: var(--cc-muted);
        }
        .chart-box { height: 300px; position: relative; }
        @media (max-width: 767px) { .chart-box { height: 240px; } }
        .chart-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 0 12px;
            font-size: 13px;
            color: var(--cc-sub);
            text-align: center;
        }

        .status {
            margin-top: 16px;
            min-height: 20px;
            font-size: 12px;
            color: var(--cc-sub);
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .status--err { color: var(--cc-danger); }

        /* ---------- 页脚 ---------- */
        .ftr {
            background: var(--cc-surface);
            border-top: 1px solid var(--cc-line);
            padding-block: clamp(24px, 3.4vw, 32px);
            text-align: center;
            font-size: 12.5px;
            line-height: 2;
            color: var(--cc-sub);
        }
        .ftr .notes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 18px;
        }
        .ftr a { color: var(--cc-accent); }
        .ftr a:hover { color: var(--cc-accent-hover); text-decoration: underline; text-underline-offset: 2px; }

        /* ---------- 减少动态效果 ---------- */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
            .skel::after { display: none; }
            .metric:hover { transform: none; }
        }

        /* ---------- 小屏 ---------- */
        @media (max-width: 767px) {
            .clock { display: none; }
        }
        @media (max-width: 719px) {
            .hdr__in { gap: 10px; min-height: 56px; }
            .nav { gap: 0; }
            .nav__link { padding: 8px 9px; font-size: 14px; }
            .hdr__cta { margin-left: 4px; }
            .brand__img { height: 32px; }
        }
        @media (max-width: 359px) {
            .nav__link { padding: 8px 8px; font-size: 13.5px; }
            .hdr__cta { padding: 8px 9px; }
            .cta__txt { display: none; }
            .brand__img { height: 30px; }
        }
    </style>
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>

<header class="hdr">
    <div class="wrap hdr__in">
        <a class="brand" href="/" aria-label="魔法师图床 首页">
            <picture>
                <source srcset="static/images/logo-horiz-540.webp" type="image/webp">
                <img class="brand__img" src="static/images/logo-horiz-540.png"
                     width="540" height="200" alt="魔法师图床" decoding="async">
            </picture>
        </a>

        <nav class="nav" aria-label="主导航">
            <a class="nav__link is-active" href="/analytics.html" aria-current="page">统计</a>
            <a class="nav__link" href="https://status.mofashi.ltd/status/img" target="_blank" rel="noopener">状态</a>
            <a class="btn btn--primary btn--sm hdr__cta" href="https://afd.mofashi.ltd" target="_blank" rel="noopener"
               aria-label="赞助我们" title="赞助我们">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 20.3l-1.2-1.1C6 14.8 3.5 12.5 3.5 9.7 3.5 7.4 5.3 5.6 7.6 5.6c1.3 0 2.6.6 3.4 1.6.8-1 2.1-1.6 3.4-1.6 2.3 0 4.1 1.8 4.1 4.1 0 2.8-2.5 5.1-7.3 9.5L12 20.3z"/>
                </svg>
                <span class="cta__txt">赞助我们</span>
            </a>
        </nav>

        <span class="clock" id="currentTime"></span>
    </div>
</header>

<main id="main" class="wrap page">
    <h1 class="page__title">数据概览</h1>
    <p class="meta" id="windowInfo">统计数据加载中…</p>

    <div class="grid">
        <div class="metric">
            <div class="label">近 24 小时 · 请求量</div>
            <div class="value skel" id="reqValue">—</div>
            <div class="sub" id="reqSub"></div>
        </div>
        <div class="metric">
            <div class="label">近 24 小时 · 流量</div>
            <div class="value skel" id="trafficValue">—</div>
            <div class="sub" id="trafficSub"></div>
        </div>
        <div class="metric">
            <div class="label">缓存命中率</div>
            <div class="value skel" id="hitValue">—</div>
            <div class="meter" id="hitMeter" aria-hidden="true"><i id="hitMeterFill"></i></div>
        </div>
        <div class="metric">
            <div class="label">回源流量</div>
            <div class="value skel" id="originValue">—</div>
            <div class="sub" id="originSub"></div>
        </div>
    </div>

    <section class="panel">
        <h2><span class="dot"></span>近 7 天 · 请求量<span class="hint">末点为今日累计</span></h2>
        <div class="chart-box"><canvas id="requestsChart"></canvas></div>
    </section>

    <section class="panel">
        <h2><span class="dot" style="--dot: var(--cc-chart-bytes)"></span>近 7 天 · 流量<span class="hint">末点为今日累计</span></h2>
        <div class="chart-box"><canvas id="bytesChart"></canvas></div>
    </section>

    <p class="status" id="status" aria-live="polite">正在加载数据…</p>
    <noscript><p class="status status--err">本页需要启用 JavaScript 才能读取统计数据。</p></noscript>
</main>

<footer class="ftr">
    <div class="wrap">
        <div class="notes">
            <span>趋势图末点为当日累计（未满 24 小时）</span>
            <span>面板仅保留近 7 天明细</span>
            <span>每 5 分钟自动刷新 · <a href="/">返回首页</a></span>
        </div>
    </div>
</footer>

<script src="https://cdn-jsdelivr.mofashi.ltd/npm/chart.js@2.9.4/dist/Chart.min.js"></script>

<script>
(function () {
    'use strict';

    var API_BASE = 'https://cdnpanel.mofashi.ltd';
    var API_TOKEN = 'b8ede8bb0127559f03be9bcb0810b874a05a1821';
    var VENDOR = 'cloudflare';
    var REFRESH_MS = 5 * 60 * 1000;

    var CSS = getComputedStyle(document.documentElement);
    var TOKEN = function (name, fallback) {
        var v = CSS.getPropertyValue(name);
        return (v && v.trim()) || fallback;
    };

    function $(id) { return document.getElementById(id); }

    /* ---------- 数值格式化 ---------- */
    // compact=true 用于坐标轴，位数更短
    function fmtBytes(v, compact) {
        if (v === null || v === undefined || isNaN(v)) return '—';
        var units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'], i = 0;
        while (v >= 1000 && i < units.length - 1) { v /= 1000; i++; }
        if (i === 0) return Math.round(v) + ' ' + units[i];
        return v.toFixed(compact ? (v >= 100 ? 0 : 1) : 2) + ' ' + units[i];
    }

    function fmtCount(v, compact) {
        if (v === null || v === undefined || isNaN(v)) return '—';
        if (v >= 1e8) return (v / 1e8).toFixed(compact ? 0 : 2) + ' 亿';
        if (v >= 1e4) return (v / 1e4).toFixed(compact ? 0 : 1) + ' 万';
        return String(Math.round(v));
    }

    function fmtPct(v) {
        if (v === null || v === undefined || isNaN(v)) return '—';
        return (v * 100).toFixed(1) + '%';
    }

    function isNum(v) { return v !== null && v !== undefined && !isNaN(v); }

    /* ---------- 取数 ---------- */
    function api(path) {
        return fetch(API_BASE + path, {
            headers: { 'Authorization': 'Bearer ' + API_TOKEN },
            cache: 'no-store'
        }).then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }).then(function (json) {
            if (!json || json.success === false) {
                throw new Error((json && json.error) || '接口返回失败');
            }
            return json;
        });
    }

    /* ---------- 图表 ---------- */
    var chartReq = null;
    var chartBytes = null;

    function createChart(canvasId, stroke, fillTop, fillBottom, fmt) {
        var canvas = $(canvasId);
        if (!canvas || typeof Chart === 'undefined') return null;

        var ctx = canvas.getContext('2d');
        var grad = ctx.createLinearGradient(0, 0, 0, 280);
        grad.addColorStop(0, fillTop);
        grad.addColorStop(1, fillBottom);

        return new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: '',
                    data: [],
                    backgroundColor: grad,
                    borderColor: stroke,
                    borderWidth: 2,
                    pointRadius: 0,
                    pointHoverRadius: 5,
                    pointHoverBackgroundColor: stroke,
                    pointHoverBorderColor: '#ffffff',
                    pointHoverBorderWidth: 2,
                    pointBackgroundColor: stroke,
                    fill: true,
                    lineTension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                legend: { display: false },
                tooltips: {
                    intersect: false,
                    mode: 'index',
                    displayColors: false,
                    backgroundColor: 'rgba(31, 36, 48, .94)',
                    titleFontColor: '#ffffff',
                    bodyFontColor: 'rgba(255, 255, 255, .92)',
                    titleFontSize: 12,
                    bodyFontSize: 13,
                    xPadding: 12,
                    yPadding: 10,
                    cornerRadius: 8,
                    caretSize: 5,
                    titleMarginBottom: 6,
                    callbacks: {
                        label: function (item) { return fmt(item.yLabel); }
                    }
                },
                scales: {
                    xAxes: [{
                        gridLines: { color: TOKEN('--cc-grid', 'rgba(31,36,48,.06)'), drawTicks: false },
                        ticks: {
                            maxTicksLimit: 8,
                            fontColor: TOKEN('--cc-muted', '#98a1b0'),
                            padding: 10
                        }
                    }],
                    yAxes: [{
                        gridLines: { color: TOKEN('--cc-grid', 'rgba(31,36,48,.06)'), drawTicks: false },
                        ticks: {
                            beginAtZero: true,
                            maxTicksLimit: 5,
                            fontColor: TOKEN('--cc-muted', '#98a1b0'),
                            callback: function (value) { return fmt(value, true); }
                        }
                    }]
                }
            }
        });
    }

    function applyChart(chart, labels, values) {
        if (!chart) return;
        // 末点（今日累计）单独放大一个点，视觉上提示"这是未满一天的数据"
        var pts = values.map(function (v, i) {
            if (!isNum(v)) return 0;
            return i === values.length - 1 ? 3.5 : 0;
        });
        chart.data.labels = labels;
        chart.data.datasets[0].data = values;
        chart.data.datasets[0].pointRadius = pts;
        chart.update();
    }

    /* ---------- 派生统计：剔除末点（当日累计），用完整日算日均/峰值 ---------- */
    function dayStats(values, labels) {
        var sum = 0, cnt = 0, peak = null, last = null;
        for (var i = 0; i < values.length; i++) {
            var v = values[i];
            if (!isNum(v)) continue;
            last = v;
            if (i === values.length - 1) continue;
            sum += v;
            cnt++;
            if (!peak || v > peak.v) peak = { v: v, l: labels[i] };
        }
        return {
            avg: cnt ? sum / cnt : null,
            peak: peak,
            total: last === null ? null : sum + last
        };
    }

    /* ---------- 渲染 ---------- */
    var gotData = false;

    function setVal(id, txt) {
        var el = $(id);
        el.textContent = txt;
        el.classList.remove('skel');
        el.classList.add('is-in');
    }

    function renderSummary(json) {
        var t = json.totals || {};
        setVal('reqValue', fmtCount(t.requests));
        setVal('trafficValue', fmtBytes(t.traffic_bytes));
        setVal('hitValue', fmtPct(t.cache_hit_rate));
        setVal('originValue', fmtBytes(t.origin_bytes));

        // 命中率进度条
        if (isNum(t.cache_hit_rate)) {
            var pct = Math.max(0, Math.min(100, t.cache_hit_rate * 100));
            $('hitMeter').classList.add('is-on');
            $('hitMeterFill').style.width = pct + '%';
        }

        // 回源占比
        if (isNum(t.origin_rate)) {
            $('originSub').textContent = '占总流量 ' + fmtPct(t.origin_rate);
        }

        // 窗口说明
        var w = json.window;
        var approx = t.is_approximate ? ' · 数值为采样约值' : '';
        $('windowInfo').textContent = w
            ? 'Cloudflare 线路 · 统计窗口 ' + w.start + ' → ' + w.end + approx
            : '';
    }

    function renderTrend(json) {
        var series = (json.series || [])[0];
        var datasets = (series && series.datasets) || {};
        var labels = json.labels || [];
        var req = datasets.requests || [];
        var bytes = datasets.traffic_bytes || [];

        // 派生上下文（口径：完整日 = 剔除末点当日累计）
        var rq = dayStats(req, labels);
        var tr = dayStats(bytes, labels);
        if (rq.avg !== null && rq.peak) {
            $('reqSub').textContent = '日均 ' + fmtCount(rq.avg) + ' · 峰值 ' + fmtCount(rq.peak.v) + '（' + rq.peak.l + '）';
        }
        if (tr.total !== null) {
            $('trafficSub').textContent = '近 7 天合计 ' + fmtBytes(tr.total);
        }

        applyChart(chartReq, labels, req);
        applyChart(chartBytes, labels, bytes);
    }

    /* ---------- 状态行 + 自动刷新倒计时 ---------- */
    var state = 'loading';      // loading | ok | error
    var isLoading = false;
    var lastOkAt = null;
    var errMsg = '';
    var nextAt = 0;

    function leftSec() { return Math.max(0, Math.ceil((nextAt - Date.now()) / 1000)); }

    function paintStatus() {
        var el = $('status');
        if (state === 'loading') {
            el.textContent = '数据刷新中…';
            el.className = 'status';
        } else if (state === 'ok') {
            el.textContent = '数据更新于 ' + lastOkAt.toLocaleTimeString('zh-CN') + ' · ' + leftSec() + ' 秒后自动刷新';
            el.className = 'status';
        } else {
            el.textContent = '数据加载失败：' + errMsg + ' · ' + leftSec() + ' 秒后重试';
            el.className = 'status status--err';
        }
    }

    function load() {
        if (isLoading) return;
        isLoading = true;
        state = 'loading';
        paintStatus();

        var done = false;
        function finish(ok, err) {
            if (done) return;
            done = true;
            isLoading = false;
            nextAt = Date.now() + REFRESH_MS;
            if (ok) {
                state = 'ok';
                lastOkAt = new Date();
            } else {
                state = 'error';
                errMsg = (err && err.message) || '未知错误';
                // 首次加载失败：撤掉骨架，显示占位符，避免一直闪
                if (!gotData) {
                    ['reqValue', 'trafficValue', 'hitValue', 'originValue'].forEach(function (id) {
                        $(id).classList.remove('skel');
                    });
                }
            }
            paintStatus();
        }

        Promise.all([
            api('/api/metrics/summary?range=24h&vendor=' + VENDOR),
            api('/api/metrics/trend?range=7d&vendor=' + VENDOR)
        ]).then(function (res) {
            renderSummary(res[0]);
            renderTrend(res[1]);
            gotData = true;
            finish(true);
        }).catch(function (err) {
            finish(false, err);
        });
    }

    setInterval(function () { if (!isLoading) paintStatus(); }, 1000);

    function tickClock() {
        var now = new Date();
        $('currentTime').textContent =
            now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN');
    }
    tickClock();
    setInterval(tickClock, 1000);

    /* ---------- 启动 ---------- */
    if (typeof Chart === 'undefined') {
        ['requestsChart', 'bytesChart'].forEach(function (id) {
            var canvas = $(id);
            if (canvas && canvas.parentNode) {
                canvas.parentNode.innerHTML = '<div class="chart-fallback">图表库加载失败，请刷新页面重试</div>';
            }
        });
        ['reqValue', 'trafficValue', 'hitValue', 'originValue'].forEach(function (id) {
            $(id).classList.remove('skel');
        });
        state = 'error';
        errMsg = '图表库加载失败';
        nextAt = Date.now() + REFRESH_MS;
        paintStatus();
    } else {
        Chart.defaults.global.defaultFontFamily = TOKEN('--cc-font', 'sans-serif');
        chartReq = createChart('requestsChart',
            TOKEN('--cc-chart-req', '#2563eb'),
            'rgba(37, 99, 235, .16)', 'rgba(37, 99, 235, 0)', fmtCount);
        chartBytes = createChart('bytesChart',
            TOKEN('--cc-chart-bytes', '#64748b'),
            'rgba(100, 116, 139, .14)', 'rgba(100, 116, 139, 0)', fmtBytes);
    }

    load();
    setInterval(load, REFRESH_MS);
}());
</script>
</body>
</html>
